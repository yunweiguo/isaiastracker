name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://isaiastracker.site
      FEATURED_STORM_ID: al092026
      INDEXNOW_ENABLED: "false"
      WEATHER_STORAGE: local
      DATA_DIR: /tmp/isaias-ci-data
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  cloudflare-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://isaiastracker.site
      FEATURED_STORM_ID: al092026
      INDEXNOW_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:cf
